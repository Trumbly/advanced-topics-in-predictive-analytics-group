name: track_b
kind: audio_multilabel
adapter: lab.tasks.track_b_birdclef:BirdclefAdapter
primary_metric: roc_auc_macro
skeleton_path: config/skeletons/audio_multilabel.py.j2
raw_data_dir: data/raw/birdclef-2026
processed_data_dir: data/processed/mels
expected_num_classes: 234
input_tensor_shape:
  - 1
  - 128
  - 313
valid_architecture_families:
  - cnn_scratch
  - efficientnet_pretrained
  - mobilenet_pretrained
  - yamnet_feature
  - perch_embedding
  - birdnet_embedding
embedding_skeleton_path: config/skeletons/audio_embedding_multilabel.py.j2
embedding_input_shapes:
  perch_embedding:
    - 1280
  birdnet_embedding:
    - 1024
embedding_processed_dirs:
  perch_embedding: data/processed/perch_emb
  birdnet_embedding: data/processed/birdnet_emb
task_description: >-
  Multi-label bird species classification from 5-second mel-spectrogram windows
  collected by acoustic recorders in the Pantanal wetlands. Predict the
  probability of presence for each of 234 species. Submission is a Kaggle
  code competition: training happens locally (no time limit), the trained
  checkpoint is uploaded as a Kaggle Dataset, and a notebook performs
  INFERENCE-ONLY over test_soundscapes within Kaggle's per-run budget
  (~90 min CPU or T4 GPU). Optimise for inference latency + accuracy, not
  training throughput.
