# Single source of truth for the `lab` agent.
#
# Every runtime knob lives here. Task-specific values live in
# config/tasks/<track>.yaml and override the defaults below.
#
# Precedence (highest wins):
#   CLI flag  >  AGENT_* env var  >  config/tasks/<track>.yaml  >  this file.
#
# NOTHING in lab/core/* is allowed to import task-specific constants. If a
# value changes between Track A and Track B, it belongs in the task YAML.

project: lab
version: "2.0.0"

# Which task adapter to run by default. Can be overridden per-invocation
# via `lab run --task track_a` or the UI's new-study form.
default_task: track_b

# All paths are repo-root relative.
paths:
  data_root: data
  experiments: experiments/studies
  sandbox: sandbox
  tasks_dir: config/tasks
  prompts_dir: config/prompts
  skeletons_dir: config/skeletons
  registry_dir: registry
  reports_dir: reports

llm:
  provider: ollama                     # ollama | openai
  base_url: http://localhost:11434/v1
  default_model: gemma4:e4b
  api_key: ollama                      # ollama ignores this; openai reads it
  temperature: 0.7
  max_tokens: 4096
  timeout_seconds: 120
  retry_attempts: 3
  retry_backoff_seconds: 5

compute_budget:
  max_experiments: 20
  max_wallclock_minutes: 240
  max_experiment_seconds: 1800         # 30 min per experiment default
  max_epochs_per_run: 3
  max_recovery_attempts: 5             # retries per experiment when code fails
  max_codegen_retries: 5               # retries if validator rejects generated code

context:
  max_prompt_tokens: 8000
  memory_top_k: 5
  memory_format: markdown

# Env-var prefix for the injected training knobs. The subprocess can read
# $AGENT_EPOCHS, $AGENT_BATCH_SIZE, etc. Task adapters may add more but must
# keep the prefix stable so generated code is portable across tasks.
env_prefix: AGENT

training:
  device: auto                         # auto | cpu | mps | cuda
  batch_size: 64
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2

logging:
  level: INFO
  console: true
  file: experiments/agent.log
  structured: true                     # JSON-lines when false; pretty when true

ui:
  host: 127.0.0.1
  port: 8765
  enable_live_sse: true

# Selective publishing defaults. Studies are unpublished by default; the
# user flips the flag via the UI or the CLI.
publishing:
  default_publish: false
  default_tags: []

# Where the generated training code physically runs. `local` uses the
# subprocess sandbox on this machine; `kaggle` pushes each experiment
# as a Kaggle notebook kernel. The UI lets you pick per-study, so this
# is only the default for new studies.
executor:
  backend: local                       # local | kaggle
  kaggle:
    username: ""                       # Kaggle username (the part before the slash in kernel slugs)
    kernel_prefix: lab-exp             # becomes slug `<username>/lab-exp-<experiment_id>`
    enable_gpu: true
    enable_internet: false             # keep off to match Kaggle competition rules
    poll_interval_seconds: 30
    poll_timeout_seconds: 36000        # 10h safety net
    dataset_sources: []                # user-dataset slugs to attach (e.g. "maxuser/my-processed-data")
    competition_sources: []            # competition slugs to attach (e.g. "birdclef-2026")
