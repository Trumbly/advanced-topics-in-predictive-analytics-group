project: lab
version: 2.0.0
default_task: track_b
llm:
  api_key: ''
  timeout_seconds: 600.0
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3-coder:30b
  temperature: 0.2
  max_tokens: 4096
  retry_attempts: 3
  retry_backoff_seconds: 5.0
compute_budget:
  device: mps
  num_workers: 4
  batch_size: 64
  max_experiments: 6
  max_wallclock_minutes: 55
  max_experiment_seconds: 600
  max_epochs_per_run: 3
  max_codegen_retries: 3
  max_recovery_attempts: 3
  lr_min: 0.0001
  lr_max: 0.01
  data_subset_percent: 10
agent:
  memory_enabled: false
  personality: exploratory
context:
  max_prompt_tokens: 6000
  memory_top_k: 5
  recent_failures: 5
logging:
  level: DEBUG
  structured: true
paths:
  data_root: data
  experiments_dir: experiments/studies
  sandbox: sandbox
  prompts_dir: config/prompts
  offline_weights: data/offline_weights
ui:
  host: 127.0.0.1
  port: 8000
