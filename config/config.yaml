project: birdclef-agent
version: "1.0"

data:
  processed_dir: data/processed
  spectrograms: data/processed/spectrograms.npy
  labels: data/processed/labels.npy
  summary: data/processed/data_summary.json

agent:
  max_experiments: 50
  model: gemma4:e4b
  temperature: 0.7
  memory_file: experiments/memory/history.json

training:
  test_size: 0.2
  random_seed: 42
  epochs: 30
  batch_size: 32

paths:
  experiments: experiments/logs
  models: models
  submissions: submissions
  reports: reports
  sandbox: sandbox/runs
