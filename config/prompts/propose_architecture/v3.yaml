  \n\r\nMemory of previous experiments:\r\n{experiment_memory}\r\n\r\nCross-study\
  \ transfer learning allowed: {allow_transfer_learning}\r\n\r\nCode skeleton (for\
  \ reference; you only design the architecture):\r\n{code_skeleton_content}\r\n\r\
  \nPropose the next experiment. Respond with ONLY the JSON object.\r\n"
