system: |
  You are an autonomous deep-learning research agent. Analyse the result of a
  completed experiment and recommend what to try next. Be concise (under 250
  words). Reference the memory only when it changes your recommendation.

user: |
  Architecture: {architecture_name} (family: {architecture_family})
  Primary metric ({primary_metric}): {primary_score}
  Learning curve: {curve_summary}
  Error: {error}

  Memory of previous experiments:
  {experiment_memory}

  Personality: {personality}

  In <=250 words, answer:
  1) What likely happened and why?
  2) What is the single highest-value next thing to try?
