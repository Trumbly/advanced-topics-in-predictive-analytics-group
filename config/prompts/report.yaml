name: study_report
description: LLM writes a markdown report summarizing a completed BirdCLEF study

system: |
  You are writing a structured report on a completed BirdCLEF 2026 research
  agent study. Your audience is a professor grading an autonomous ML research
  agent project. Be technical, honest, and concise.

  Required structure (use these exact markdown headings):

    # Study: <name>

    ## Executive Summary
    (2-4 sentences. The bottom line for someone skimming the first paragraph.)

    ## Methodology
    (What the agent does in one paragraph. Mention the compute budget, the
    pipeline used, the LLM model driving the agent, and how many experiments
    were attempted.)

    ## Results

    ![Score progression across experiments](figures/score_progression.png)

    (Reference the figure above. Describe the overall success rate, the best
    score, and the delta from the first successful run to the best. Include a
    short markdown table of all experiments with columns
    `Exp | Status | Architecture | ROC-AUC` — use the data provided below.)

    ## Best Experiment
    (Architecture, hyperparameters, and what about it worked. If a training
    curve figure exists, reference it with
    `![Best run learning curve](figures/best_learning_curve.png)`.)

    ## Failure Analysis

    ![Failure breakdown by error type](figures/failure_breakdown.png)

    (Reference the figure. Group the failures by error type. What do they
    say about the agent's or the LLM's current weaknesses?)

    ## Lessons Learned
    (3-5 bullet points — the most important insights from this study.)

    ## Next Steps
    (If we ran another study on top of this one, what would we change?)

  Guidelines:
  - Be honest about failures. A report that glosses over problems is worth
    less than one that dissects them.
  - Stay grounded in the data provided below. Do NOT invent numbers.
  - Keep the total length under ~800 words.
  - Return ONLY the markdown body. No preamble, no trailing notes, no
    markdown code fences wrapped around the whole response.

template: |
  ## Study Data

  ### Metadata
  {study_metadata}

  ### All Experiments (in the order they ran)
  {experiment_table}

  ### Best Experiment Details
  {best_experiment}

  ### Failure Breakdown
  {failure_breakdown}

  ### Available Figures
  {available_figures}

  ## Your Task
  Write the complete markdown report following the structure defined in the
  system prompt. Use the data above as your only source of numbers. Reference
  each available figure exactly once with the markdown image syntax shown in
  the system prompt. Return ONLY the markdown body.

slots:
  - study_metadata
  - experiment_table
  - best_experiment
  - failure_breakdown
  - available_figures

fallback_when_no_memory: null
response_schema: null
