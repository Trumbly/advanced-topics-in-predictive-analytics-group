[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab"
version = "2.0.0"
description = "Autonomous research agent for the BirdCLEF+ 2026 Kaggle competition (Advanced Predictive Analytics, Track B)."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Advanced Topics in Predictive Analytics — Group" }]

dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  # UI
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  # Reporting
  "matplotlib>=3.8",
  # ML runtime (optional at import time — used by generated code + tests)
  "torch",
  "torchvision",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "nbformat>=5.7",
  "markdown-it-py>=3.0",
  # Audio preprocessing — soundscape window slicing + mel-spec generation
  "librosa>=0.10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
