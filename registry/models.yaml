# Model Registry — catalog of architectures the agent may select from.
#
# The LLM is prompted with this catalog (via ModelRegistry.to_markdown) and
# must propose models by `name`. This prevents hallucinated imports and
# guarantees every selected model is known to work with the fixed pipeline.
#
# To add a new model:
#   1. Append an entry below following the schema.
#   2. Make sure the import_snippet is complete and self-contained.
#   3. Make sure the input_shape matches the spectrogram shape produced by
#      pipelines/audio_pipeline.py (or document the required reshape).

models:

  - name: cnn_small_v1
    family: cnn
    input_shape: [1, 128, 500]
    output_dim: num_classes        # use the variable, NOT a literal
    parameters_millions: 0.04
    pretrained_on: none
    suitability_notes: >
      Tiny from-scratch baseline (≈37k parameters). 3 Conv2D blocks +
      adaptive pool + linear head. Trains in under 2 minutes on CPU.
      Use as a sanity check before touching heavier architectures.
    framework: torch
    import_snippet: |
      from pipelines.models import CnnSmallV1
      model = CnnSmallV1(num_classes=num_classes, in_channels=1)

  - name: efficientnet_b0
    family: cnn
    input_shape: [1, 128, 500]    # original spectrogram shape — the adapter resizes
    output_dim: num_classes
    parameters_millions: 4.3
    pretrained_on: none            # sandbox has no internet, so pretrained=False
    suitability_notes: >
      EfficientNet-B0 backbone wrapped in TorchvisionAdapter. The adapter
      takes the raw (B, 1, 128, T) spectrogram, repeats the channel to 3,
      bilinearly resizes to 224x224, runs the backbone, and uses a
      LazyLinear head to produce `num_classes` logits. Pretrained weights
      are NOT loaded (sandbox is offline) — the backbone trains from
      scratch. ~4.3M parameters, strong expressiveness but slower per
      batch than CnnSmallV1.
    framework: torch
    import_snippet: |
      from pipelines.models import TorchvisionAdapter
      model = TorchvisionAdapter("efficientnet_b0", num_classes=num_classes)

  - name: resnet18
    family: cnn
    input_shape: [1, 128, 500]
    output_dim: num_classes
    parameters_millions: 11.3
    pretrained_on: none
    suitability_notes: >
      ResNet-18 via TorchvisionAdapter. Same channel-expand + 224x224
      resize pipeline as efficientnet_b0. ~11.3M parameters, heavier
      than EfficientNet-B0 per forward pass but very stable to train
      from scratch. Good fallback when EfficientNet fails to converge.
    framework: torch
    import_snippet: |
      from pipelines.models import TorchvisionAdapter
      model = TorchvisionAdapter("resnet18", num_classes=num_classes)

  - name: mobilenet_v3_small
    family: cnn
    input_shape: [1, 128, 500]
    output_dim: num_classes
    parameters_millions: 1.0
    pretrained_on: none
    suitability_notes: >
      MobileNet-V3 Small via TorchvisionAdapter — the lightest
      architecture family we offer (≈1M params). Well-suited to the
      CPU-only Kaggle inference budget. Use when the bigger backbones
      hit runtime limits.
    framework: torch
    import_snippet: |
      from pipelines.models import TorchvisionAdapter
      model = TorchvisionAdapter("mobilenet_v3_small", num_classes=num_classes)

  - name: efficientnet_b2
    family: cnn
    input_shape: [1, 128, 500]
    output_dim: num_classes
    parameters_millions: 7.8
    pretrained_on: imagenet (optional)
    suitability_notes: >
      EfficientNet-B2 via TorchvisionAdapter — larger than B0 with more
      capacity for fine-grained spectrogram features. ~7.8M parameters.
      Use pretrained=True for ImageNet transfer learning (requires cached
      weights or internet during training). A strong upgrade from B0
      when B0 has plateaued.
    framework: torch
    import_snippet: |
      from pipelines.models import TorchvisionAdapter
      model = TorchvisionAdapter("efficientnet_b2", num_classes=num_classes, pretrained=True)

  - name: convnext_tiny
    family: cnn
    input_shape: [1, 128, 500]
    output_dim: num_classes
    parameters_millions: 28.6
    pretrained_on: imagenet
    suitability_notes: >
      ConvNeXt-Tiny via TorchvisionAdapter — a modern pure-CNN architecture
      that matches vision transformer performance. Fundamentally different
      from EfficientNet (uses depthwise convolutions, LayerNorm, GELU).
      Excellent for ensemble diversity. ~28.6M params. Use pretrained=True.
    framework: torch
    import_snippet: |
      from pipelines.models import TorchvisionAdapter
      model = TorchvisionAdapter("convnext_tiny", num_classes=num_classes, pretrained=True)

  - name: efficientnet_v2_s
    family: cnn
    input_shape: [1, 128, 500]
    output_dim: num_classes
    parameters_millions: 21.5
    pretrained_on: imagenet
    suitability_notes: >
      EfficientNet-V2-Small via TorchvisionAdapter — successor to EfficientNet
      with faster training and better accuracy. Uses progressive learning and
      Fused-MBConv blocks. Strong standalone model and excellent ensemble
      member with B0/B2. ~21.5M params. Use pretrained=True.
    framework: torch
    import_snippet: |
      from pipelines.models import TorchvisionAdapter
      model = TorchvisionAdapter("efficientnet_v2_s", num_classes=num_classes, pretrained=True)

  - name: tf_efficientnet_b3
    family: cnn
    input_shape: [1, 128, 500]
    output_dim: num_classes
    parameters_millions: 12.0
    pretrained_on: imagenet (via timm)
    suitability_notes: >
      EfficientNet-B3 from the timm library (TensorFlow-ported weights).
      A BirdCLEF competition favorite — top solutions frequently use B3
      as the sweet spot between accuracy and speed. Requires the `timm`
      package. ~12M params. Use pretrained=True for ImageNet transfer.
    framework: torch
    import_snippet: |
      import timm
      backbone = timm.create_model("tf_efficientnet_b3", pretrained=True, num_classes=0)
      model = nn.Sequential(backbone, nn.LazyLinear(num_classes))

  - name: sed_efficientnet_b0
    family: sed
    input_shape: [1, 128, 500]
    output_dim: num_classes
    parameters_millions: 4.5
    pretrained_on: imagenet (optional)
    suitability_notes: >
      Sound Event Detection model with attention-based temporal pooling
      over an EfficientNet-B0 backbone. Instead of global average pooling,
      it uses a learned attention mechanism that weights each spatial
      position by importance — critical for BirdCLEF soundscapes where
      bird calls occupy only part of the 5-second window. ~4.5M params.
    framework: torch
    import_snippet: |
      from pipelines.models import SEDAttentionModel
      model = SEDAttentionModel("efficientnet_b0", num_classes=num_classes, pretrained=True)
