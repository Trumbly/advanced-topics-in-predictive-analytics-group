# Track B — candidate architectures for BirdCLEF+ audio multi-label.
# `backbone` = torchvision constructor path; `weights` = name of the
# pretrained weights the executor has pre-downloaded offline. `timm` is
# an optional alternative constructor name for the same backbone family.

- name: cnn_small_v1
  family: custom_cnn
  input_shape: [1, 128, 313]
  input_channels: 1
  pretrained: false
  description: >
    3 Conv2d blocks with BatchNorm + AdaptiveAvgPool2d + Dense head.
    CPU-friendly baseline (~800k params). No pretrained weights.
  how_to_use: >
    Build from scratch inside build_model. No transfer learning — use as
    a sanity baseline, not as a score target.
  params_approx: 800_000

- name: resnet18_adapter
  family: resnet18
  backbone: torchvision.models.resnet18
  weights: DEFAULT
  timm: resnet18
  input_shape: [1, 128, 313]
  input_channels: 3
  pretrained: true
  description: >
    torchvision resnet18 (ImageNet-pretrained). Fast, solid transfer baseline.
  how_to_use: >
    Prepend a nn.Conv2d(1, 3, kernel_size=1) adapter so the 1-channel
    spectrogram matches the 3-channel ImageNet input. Replace model.fc
    with nn.Linear(model.fc.in_features, num_classes).
  params_approx: 11_000_000

- name: efficientnet_b0_adapter
  family: efficientnet_b0
  backbone: torchvision.models.efficientnet_b0
  weights: DEFAULT
  timm: tf_efficientnet_b0_ns
  input_shape: [1, 128, 313]
  input_channels: 3
  pretrained: true
  description: >
    torchvision efficientnet_b0. Slightly slower than resnet18 but
    typically the strongest score-per-parameter option on spectrograms.
  how_to_use: >
    Use a 1->3 channel adapter. Replace model.classifier[-1] with
    nn.Linear(model.classifier[-1].in_features, num_classes). Under
    DataParallel the skeleton auto-disables StochasticDepth — leave it.
  params_approx: 5_300_000

- name: mobilenet_v3_small_adapter
  family: mobilenet_v3_small
  backbone: torchvision.models.mobilenet_v3_small
  weights: DEFAULT
  timm: mobilenetv3_small_100
  input_shape: [1, 128, 313]
  input_channels: 3
  pretrained: true
  description: >
    Small pretrained backbone; lowest-latency T4 candidate. Good when
    wallclock budget is tight.
  how_to_use: >
    1->3 channel adapter. Replace model.classifier[-1] with
    nn.Linear(model.classifier[-1].in_features, num_classes).
  params_approx: 2_500_000

- name: resnet50_adapter
  family: resnet50
  backbone: torchvision.models.resnet50
  weights: DEFAULT
  timm: resnet50
  input_shape: [1, 128, 313]
  input_channels: 3
  pretrained: true
  description: >
    Deeper ResNet; higher ceiling but ~2x compute vs resnet18. Worth trying
    once the smaller backbones plateau.
  how_to_use: >
    1->3 adapter. Replace model.fc with nn.Linear(model.fc.in_features,
    num_classes).
  params_approx: 25_000_000
