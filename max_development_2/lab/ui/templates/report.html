{% extends "base.html" %}
{% block title %}Report — {{ study_id }}{% endblock %}
{% block content %}
<section class="page-head">
  <nav class="crumbs"><a href="/studies/{{ study_id }}">Study</a> / Report</nav>
  <h1>Report</h1>
</section>

<section class="card markdown" id="md-target">
  <pre class="raw-md">{{ markdown }}</pre>
</section>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script>
window.addEventListener("load", () => {
  const target = document.getElementById("md-target");
  if (!target || !window.marked) return;
  const pre = target.querySelector(".raw-md");
  let src = pre.textContent;
  // Rewrite relative figure paths to the report-figures endpoint.
  src = src.replace(/\]\(figures\//g, "](/studies/{{ study_id }}/report/figures/");
  target.innerHTML = marked.parse(src);
});
</script>
{% endblock %}
