<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='styles.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">lab</span>
      <span class="brand-ver">v2</span>
    </a>
    <nav class="topnav">
      <a href="/">Studies</a>
      <a href="/new">New study</a>
      <a href="/prompts">Prompts</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span class="muted">single-source-of-truth: <code>config/config.yaml</code></span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
