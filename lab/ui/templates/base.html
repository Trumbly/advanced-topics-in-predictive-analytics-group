<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}lab{% endblock %}</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 1100px; margin: 1em auto; padding: 0 1em; background: #0e1014; color: #d6dadf; }
    a { color: #6cb1ff; }
    h1 { font-size: 1.4em; border-bottom: 1px solid #2a2f37; padding-bottom: 4px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #2a2f37; padding: 6px 8px; text-align: left; font-size: 0.9em; }
    th { background: #15191f; }
    .nav { margin-bottom: 1em; }
    .nav a { margin-right: 12px; }
    .pill { display: inline-block; padding: 1px 6px; border-radius: 3px; background: #1c2129; font-size: 0.8em; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/studies">studies</a>
    <a href="/prompts">prompts</a>
  </div>
  {% block content %}{% endblock %}
</body>
</html>
