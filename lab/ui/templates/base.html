<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='styles.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <!-- Theme bootstrap — runs inline BEFORE <body> paints to avoid a flash
       of the wrong theme. Reads the stored choice or falls back to the
       system preference. -->
  <script>
    (function () {
      const saved = localStorage.getItem("lab-theme");
      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      const theme = saved || (prefersLight ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">lab</span>
      <span class="brand-ver">v2</span>
    </a>
    <nav class="topnav">
      <a href="/">Studies</a>
      <a href="/new">New study</a>
      <a href="/prompts">Prompts</a>
      <a href="/config">Config</a>
      <button type="button" class="theme-toggle" id="theme-toggle"
              aria-label="Toggle light/dark theme" title="Toggle theme">
        <!-- shown in dark mode (click → go light) -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <!-- shown in light mode (click → go dark) -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span class="muted">single-source-of-truth: <code>config/config.yaml</code></span>
  </footer>

  <script>
    (function () {
      const btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme") || "dark";
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("lab-theme", next); } catch (_) {}
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
