<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BirdCLEF Agent Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    pre.code { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.8rem; line-height: 1.4; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-completed { background: #dcfce7; color: #166534; }
    .badge-failed { background: #fee2e2; color: #991b1b; }
    .badge-running { background: #dbeafe; color: #1e40af; }
    .badge-timeout { background: #fef3c7; color: #92400e; }
    .badge-default { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <nav class="bg-slate-900 text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-semibold text-lg">
        <span class="text-2xl">🦜</span>
        BirdCLEF Agent Dashboard
      </a>
      <div class="flex items-center gap-4 text-sm text-slate-300">
        <a href="/" class="hover:text-white">Studies</a>
        <a href="/prompts" class="hover:text-white">Prompts</a>
        <a href="/api/healthz" class="hover:text-white text-slate-400" title="API health">health</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-7xl mx-auto px-4 py-8 text-xs text-slate-400">
    Read-only dashboard v0.1 — data from <code>{{ studies_root or "experiments/studies/" }}</code>.
    Launch studies via <code>agent study ...</code>.
  </footer>
</body>
</html>
