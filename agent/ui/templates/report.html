{% extends "base.html" %}
{% block title %}Report · {{ study.name }}{% endblock %}
{% block content %}

<div class="mb-6">
  <a href="/studies/{{ study.study_id }}" class="text-sm text-slate-500 hover:text-slate-900">&larr; Back to study</a>
  <h1 class="text-3xl font-bold mt-2">Report · {{ study.name }}</h1>
  <p class="text-xs text-slate-500 font-mono mt-1">{{ study.study_id }}</p>
</div>

<article class="rounded-lg border border-slate-200 bg-white p-8">
  <pre class="whitespace-pre-wrap text-sm leading-relaxed font-sans">{{ report_md }}</pre>
</article>

{% endblock %}
